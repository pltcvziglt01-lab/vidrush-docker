<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="BEDOSAHO AI — konu ver, araştırmalı belgesel videoyu kur.">
<!-- ⚠ KOK YOLU: `<base>` ETIKETI YOK — ne sabit ne hesaplanmis.
     Sabit `<base href="/">` uygulama bir alt dizinde sunuldugunda (ornek
     `/vidrush/`) tum varlik ve API yollarini koke kacirir.
     Hesaplanmis base de DENENDI ve ZARARLI cikti: `/vidrush` (sonda egik
     cizgi YOK) icin dizin `/` olarak hesaplandi, `location.replace('#/ana')`
     base'e gore cozuldu ve uygulama `/#/ana` adresine atladi — alt dizin
     kayboldu.
     Dogru cozum en yalin olani: HIC base kullanma, tum varlik ve API
     yollarini basinda / OLMADAN yaz. Tarayicinin standart cozumlemesi
     sayfanin bulundugu dizini korur:
       /          -> /ui/app.css          · /api/saglik
       /vidrush/  -> /vidrush/ui/app.css  · /vidrush/api/saglik
     (Sonda egik cizgi olmadan sunuluyorsa proxy `/vidrush/`e yonlendirmeli;
      HTTP'de dizin/dosya ayrimi egik cizgiyle yapilir.) -->
<title>BEDOSAHO AI</title>
<link rel="stylesheet" href="ui/app.css">
</head>
<body>
<a class="atla" href="#anaicerik">İçeriğe atla</a>

<!-- ══ UST BAR ══ -->
<header class="ustbar" role="banner">
  <div class="ustbar-ic">
    <a class="marka" href="#/ana" aria-label="BEDOSAHO AI ana sayfası">
      <span class="marka-im" data-ikon="logo" aria-hidden="true"></span>
      <span class="marka-ad">BEDOSAHO<span class="marka-ai">AI</span></span>
    </a>
    <div class="ustbar-sag">
      <span id="saglikPul" class="pul" role="status" aria-live="polite"
            title="Sistem durumu">
        <span class="pul-nokta" data-durum="bilinmiyor"></span>
        <span class="pul-yazi">Durum kontrol ediliyor</span>
      </span>
      <a class="dugme dugme-hayalet mobil-gizle" href="#/ayarlar">
        <span data-ikon="ayar" aria-hidden="true"></span> Ayarlar
      </a>
      <a class="dugme dugme-ana" href="#/yeni">
        <span data-ikon="arti" aria-hidden="true"></span> Yeni Proje
      </a>
    </div>
  </div>
</header>

<div class="kabuk">
  <!-- ══ MASAUSTU YAN MENU ══ -->
  <nav class="yanmenu" aria-label="Ana gezinme">
    <ul id="yanMenu" class="yanmenu-liste"></ul>
    <div class="yanmenu-dip">
      <p class="kucuk sessiz">Yerel sürüm · arayüz Faz F</p>
    </div>
  </nav>

  <!-- ══ ICERIK ══ -->
  <main id="anaicerik" class="icerik" tabindex="-1">
    <div id="gorunumKap" class="gorunum-kap" aria-live="polite"></div>
  </main>
</div>

<!-- ══ MOBIL ALT NAV (4 oge) ══ -->
<nav class="altnav" aria-label="Mobil gezinme">
  <ul id="altNav" class="altnav-liste"></ul>
</nav>

<!-- Ekran okuyucu duyurulari -->
<div id="duyuru" class="gorunmez" role="status" aria-live="polite"></div>

<script type="module" src="ui/app.js"></script>
</body>
</html>
